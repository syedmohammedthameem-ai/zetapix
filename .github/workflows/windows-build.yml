name: Windows build

# Tauri cannot cross-compile to Windows, so the installer is built on a real
# Windows runner. Run it from the Actions tab, or push a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # FFmpeg is not committed: it is 40 MB per platform and belongs to the
      # build, not the source. The GPL build carries NVENC, Quick Sync and AMF,
      # so the chip probe finds hardware encoders on the user's machine.
      - name: Fetch FFmpeg sidecars
        shell: pwsh
        run: |
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract
          $exe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in the downloaded archive' }
          $bin = $exe.Directory.FullName
          Copy-Item "$bin\ffmpeg.exe"  'src-tauri\bin\aicompress_ffmpeg-x86_64-pc-windows-msvc.exe'
          Copy-Item "$bin\ffprobe.exe" 'src-tauri\bin\aicompress_ffprobe-x86_64-pc-windows-msvc.exe'
          & 'src-tauri\bin\aicompress_ffmpeg-x86_64-pc-windows-msvc.exe' -hide_banner -encoders |
            Select-String -Pattern 'nvenc|qsv|amf' | Select-Object -First 5

      # The install hook runs `fnm use`, which is not present on the runner.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check types
        run: pnpm tsc:check

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        run: pnpm tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: aicompress-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
